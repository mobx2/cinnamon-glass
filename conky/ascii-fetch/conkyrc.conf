-- MOBX ASCII Art + Fastfetch-style Desktop Widget (top_left, symmetrical with right Conky)
conky.config = {
    background = false,
    double_buffer = true,
    no_buffers = true,
    update_interval = 2,
    imlib_cache_size = 0,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    uppercase = false,
    use_spacer = 'none',

    -- Exact top alignment with right-side Conky (gap_x=28, gap_y=45)
    xinerama_head = 0,
    alignment = 'top_left',
    gap_x = 28,
    gap_y = 45,
    minimum_width = 295,
    maximum_width = 310,

    -- Graphical
    border_inner_margin = 10,
    border_outer_margin = 10,
    draw_borders = false,
    draw_graph_borders = false,
    draw_shades = false,
    draw_outline = false,

    -- Transparent desktop widget window
    own_window = true,
    own_window_argb_visual = true,
    own_window_transparent = true,
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Bigger, punchier typography for MOBX + Fetch
    use_xft = true,
    xftalpha = 1,
    font = 'JetBrains Mono:size=9.8',
    font2 = 'JetBrains Mono:bold:size=9.5',
    font3 = 'JetBrains Mono:bold:size=11',

    -- Catppuccin Mocha palette (harmonized with right-side Conky)
    default_color = '#E2E8F0',
    color1 = '#CBA6F7', -- Mauve
    color2 = '#B4BEFE', -- Lavender
    color3 = '#89B4FA', -- Blue
    color4 = '#FAB387', -- Peach
    color5 = '#94E2D5', -- Teal
    color9 = '#6C7086', -- Muted Overlay
}

conky.text = [[
${font2}${color1}███╗   ███╗ ██████╗ ██████╗ ██╗  ██╗
${color1}████╗ ████║██╔═══██╗██╔══██╗╚██╗██╔╝
${color2}██╔████╔██║██║   ██║██████╔╝ ╚███╔╝
${color2}██║╚██╔╝██║██║   ██║██╔══██╗ ██╔██╗
${color3}██║ ╚═╝ ██║╚██████╔╝██████╔╝██╔╝ ██╗
${color3}╚═╝     ╚═╝ ╚═════╝ ╚═════╝ ╚═╝  ╚═╝${font}
${voffset 5}${font3}${color1}${execi 36000 whoami}${color9}@${color3}${nodename}${font}
${color9}───────────────────────────────${voffset 5}
${color3}os       ${color9}│ ${color}${execi 36000 grep -m1 "^PRETTY_NAME=" /etc/os-release | cut -d= -f2 | tr -d '"'}
${color3}kernel   ${color9}│ ${color}${kernel}
${color3}wm       ${color9}│ ${color}Cinnamon (${XDG_SESSION_TYPE:-X11})
${color3}shell    ${color9}│ ${color}${execi 36000 basename "${SHELL:-bash}"}
${color3}terminal ${color9}│ ${color}${execi 36000 gsettings get org.cinnamon.desktop.default-applications.terminal exec | tr -d "'" | awk '{print $1}'}
${color3}cpu      ${color9}│ ${color}${execi 36000 awk -F: '/model name/{gsub(/^ +| *\(R\)| *\(TM\)| *CPU.*$/,"",$2); gsub(/ +/," ",$2); print substr($2,1,24); exit}' /proc/cpuinfo}
${color3}gpu      ${color9}│ ${color}${execi 36000 lspci 2>/dev/null | awk -F: '/VGA|3D/{sub(/^ +/,"",$3); sub(/ \[.*$/,"",$3); sub(/ \(rev.*$/,"",$3); print substr($3,1,24); exit}'}
${color3}memory   ${color9}│ ${color4}${mem}${color9} / ${color}${memmax}
${color3}packages ${color9}│ ${color}${execi 3600 dpkg-query -f '.\n' -W | wc -l} (dpkg)
${color3}uptime   ${color9}│ ${color5}${uptime_short}
]]
